    <rect x="64" y="36" width="10" height="8" rx="2" fill="#dfe6c3" transform="rotate(6 69 40)"/>
    <!-- handle -->
    <path d="M85 48 Q104 50 103 62 Q102 74 86 74" fill="none" stroke-width="4"/>
    <!-- label band -->
    <path d="M40 62 L84 60 L85 80 Q62 88 41 81 Z" fill="#f6efdc"/>
    <path d="M44 68 L81 66" fill="none" stroke-width="1.6"/>
    <path d="M44 78 L81 76" fill="none" stroke-width="1.6"/>
    <!-- cat face (no text) -->
    <path d="M56 71 l3 -4 3 4 M62 71 l3 -4 3 4" fill="none" stroke-width="1.6"/>
    <circle cx="59" cy="74" r="1.1" fill="#2e2418" stroke="none"/>
    <circle cx="65" cy="74" r="1.1" fill="#2e2418" stroke="none"/>
    <path d="M60 77 q2 1.6 4 0" fill="none" stroke-width="1.4"/>
  </g>
</svg>
