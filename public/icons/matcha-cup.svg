    <!-- straw -->
    <path d="M74 8 L82 34" fill="none" stroke-width="4.5"/>
    <!-- mug body -->
    <path d="M38 34 Q37 30 42 29 L80 28 Q85 28 84 33 L86 78 Q87 100 62 101 Q38 102 38 80 Z" fill="#f2ead2"/>
    <!-- matcha band -->
    <path d="M39 34 Q60 40 84 32 L85 52 Q61 60 40 53 Z" fill="#7a944e"/>
